<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password - TechXpress</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="container py-5 d-flex justify-content-center">
  <div class="tx-card" style="width:100%;max-width:420px">
    <h5>Reset your password</h5>

    <form id="emailForm" novalidate>
      <p class="text-muted">Enter your account email. (In the real site we will email you a reset link. Here you can reset it directly.)</p>
      <input id="resetEmail" type="email" class="form-control" placeholder="you@email.com">
      <div class="invalid-feedback">No account found with this email</div>
      <button class="btn btn-primary w-100 mt-3">Continue</button>
    </form>

    <form id="newPassForm" class="d-none" novalidate>
      <label class="form-label">New password</label>
      <input id="newPass" type="password" class="form-control">
      <div class="invalid-feedback">At least 6 characters</div>
      <label class="form-label mt-3">Confirm new password</label>
      <input id="newPassConfirm" type="password" class="form-control">
      <div class="invalid-feedback">Passwords do not match</div>
      <button class="btn btn-primary w-100 mt-3">Save new password</button>
    </form>

    <p class="text-center mt-3 mb-0"><a href="login.html">Back to sign in</a></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
initPage();
let resetFor = "";

document.getElementById("emailForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const input = document.getElementById("resetEmail");
  const user = getUsers().find(function (u) { return u.email.toLowerCase() === input.value.trim().toLowerCase(); });
  if (setInvalid(input, !user)) return;
  resetFor = user.email;
  this.classList.add("d-none");
  document.getElementById("newPassForm").classList.remove("d-none");
});

document.getElementById("newPassForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const p1 = document.getElementById("newPass");
  const p2 = document.getElementById("newPassConfirm");
  const bad = [setInvalid(p1, p1.value.length < 6), setInvalid(p2, p2.value !== p1.value)];
  if (bad.includes(true)) return;
  updateUser(resetFor, { password: p1.value });
  showToast("✓ Password updated. Please sign in.");
  setTimeout(function () { location.href = "login.html"; }, 1200);
});
</script>
</body>
</html>
