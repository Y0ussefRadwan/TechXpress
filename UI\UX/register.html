<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Account - TechXpress</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="row g-0">
  <div class="col-md-6 login-left">
    <h1 class="fw-bold">Join TechXpress.</h1>
    <p>Create an account to order faster, save your wishlist and track every order.</p>
  </div>
  <div class="col-md-6 d-flex align-items-center justify-content-center p-4">
    <form id="registerForm" class="tx-card" style="width:100%;max-width:380px" novalidate>
      <h5>Create Account</h5>
      <div id="registerError" class="alert alert-danger py-2 d-none"></div>

      <label class="form-label">Full name</label>
      <input id="regName" class="form-control">
      <div class="invalid-feedback">Name is required</div>

      <label class="form-label mt-3">Email</label>
      <input id="regEmail" type="email" class="form-control">
      <div class="invalid-feedback">Enter a valid email address</div>

      <label class="form-label mt-3">Password</label>
      <input id="regPassword" type="password" class="form-control">
      <div class="invalid-feedback">At least 6 characters</div>

      <label class="form-label mt-3">Confirm password</label>
      <input id="regConfirm" type="password" class="form-control">
      <div class="invalid-feedback">Passwords do not match</div>

      <button class="btn btn-primary w-100 mt-3">Create Account</button>
      <p class="text-center mt-3 mb-0 text-muted">Already have an account? <a href="login.html">Sign in</a></p>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
initPage();

document.getElementById("registerForm").addEventListener("submit", function (e) {
  e.preventDefault();
  const name = document.getElementById("regName");
  const email = document.getElementById("regEmail");
  const pass = document.getElementById("regPassword");
  const confirmPass = document.getElementById("regConfirm");
  const error = document.getElementById("registerError");
  error.classList.add("d-none");

  const bad = [
    setInvalid(name, name.value.trim() === ""),
    setInvalid(email, !isEmail(email.value.trim())),
    setInvalid(pass, pass.value.length < 6),
    setInvalid(confirmPass, confirmPass.value !== pass.value)
  ];
  if (bad.includes(true)) return;

  const result = register(name.value.trim(), email.value.trim(), pass.value);
  if (result.error) { error.textContent = result.error; error.classList.remove("d-none"); return; }
  location.href = safeNext("index.html");
});
</script>
</body>
</html>
