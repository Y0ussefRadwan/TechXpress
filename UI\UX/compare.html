<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compare Products - TechXpress</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Compare products</h3>
    <button id="clearBtn" class="btn btn-outline-secondary">Clear all</button>
  </div>
  <div id="compareEmpty" class="tx-card text-center d-none">
    <p>No products to compare yet. Use the ⇄ button on any product.</p>
    <a href="catalog.html" class="btn btn-outline-primary">Browse products</a>
  </div>
  <div id="compareBox" class="tx-card table-responsive"></div>
</div>
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
initPage();

function renderCompare() {
  const list = getCompare().map(getProduct).filter(Boolean);
  document.getElementById("compareEmpty").classList.toggle("d-none", list.length > 0);
  document.getElementById("compareBox").classList.toggle("d-none", list.length === 0);
  document.getElementById("clearBtn").classList.toggle("d-none", list.length === 0);
  if (list.length === 0) return;

  // all spec names used by the selected products
  const keys = [];
  list.forEach(function (p) { Object.keys(p.specs || {}).forEach(function (k) { if (!keys.includes(k)) keys.push(k); }); });

  let html = '<table class="table align-middle text-center"><thead><tr><th></th>' + list.map(function (p) {
    return '<th><button class="btn btn-sm text-danger float-end" data-remove="' + p.id + '">✕</button><div class="fs-1">' + p.icon + '</div>' +
      '<a href="product-details.html?id=' + p.id + '" class="text-reset text-decoration-none">' + esc(p.name) + '</a><br><small class="text-muted">' + esc(p.brand) + '</small></th>';
  }).join("") + '</tr></thead><tbody>';

  html += '<tr><td class="text-muted text-start">Price</td>' + list.map(function (p) { return '<td><strong>' + money(p.price) + '</strong></td>'; }).join("") + '</tr>';
  keys.forEach(function (k) {
    html += '<tr><td class="text-muted text-start">' + esc(k) + '</td>' + list.map(function (p) { return '<td>' + esc((p.specs || {})[k] || "-") + '</td>'; }).join("") + '</tr>';
  });
  html += '<tr><td class="text-muted text-start">Availability</td>' + list.map(function (p) { return '<td>' + stockBadge(p) + '</td>'; }).join("") + '</tr>';
  html += '<tr><td></td>' + list.map(function (p) {
    return '<td>' + (p.stock > 0 ? '<button class="btn btn-primary btn-sm add-btn" data-id="' + p.id + '">Add to Cart</button>' : '<button class="btn btn-outline-secondary btn-sm" disabled>Unavailable</button>') + '</td>';
  }).join("") + '</tr></tbody></table>';

  document.getElementById("compareBox").innerHTML = html;
}

document.getElementById("compareBox").addEventListener("click", function (e) {
  const rm = e.target.closest("[data-remove]");
  if (rm) { toggleCompare(rm.dataset.remove); renderCompare(); }
});
document.getElementById("clearBtn").addEventListener("click", function () { clearCompare(); renderCompare(); });

renderCompare();
</script>
</body>
</html>
