<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shopping Cart - TechXpress</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="container py-4">
  <h3>Shopping Cart <small id="itemsCount" class="text-muted fs-6"></small></h3>
  <div class="row g-3">
    <div class="col-lg-8">
      <div class="tx-card">
        <div id="cartItems"></div>
        <a href="catalog.html" class="d-block mt-3">← Continue shopping</a>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="tx-card">
        <h5>Order summary</h5>
        <div class="d-flex justify-content-between"><span>Subtotal</span><span id="subtotal"></span></div>
        <div id="discountRow" class="d-flex justify-content-between text-success d-none"><span id="discountLabel">Discount</span><span id="discount"></span></div>
        <div class="d-flex justify-content-between"><span>Shipping</span><span id="shipping"></span></div>
        <div class="d-flex justify-content-between"><span>Tax</span><span id="tax"></span></div>
        <hr>
        <div class="d-flex justify-content-between fw-bold fs-5"><span>Total</span><span id="total"></span></div>

        <div id="couponForm" class="input-group my-3">
          <input id="couponInput" class="form-control" placeholder="Coupon code (try TECH10)">
          <button id="couponBtn" class="btn btn-outline-primary">Apply</button>
        </div>
        <div id="couponApplied" class="my-3 d-none"><span class="badge text-bg-success" id="couponName"></span> <a href="#" id="removeCoupon">remove</a></div>

        <a id="checkoutBtn" href="checkout.html" class="btn btn-primary w-100">Proceed to checkout</a>
        <small id="checkoutNote" class="text-danger d-none">Remove the out-of-stock items to continue.</small>
      </div>
    </div>
  </div>
</div>
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
initPage();

function renderCart() {
  const lines = cartLines();
  const active = lines.filter(function (l) { return !l.out; });
  const hasOut = lines.some(function (l) { return l.out; });

  document.getElementById("cartItems").innerHTML = lines.length === 0
    ? '<div class="text-center py-4"><p class="text-muted">Your cart is empty</p><a href="catalog.html" class="btn btn-outline-primary">Browse products</a></div>'
    : lines.map(function (l) {
        const p = l.product;
        return (
          '<div class="d-flex align-items-center gap-3 border-bottom py-3">' +
            '<a href="product-details.html?id=' + p.id + '" class="tx-card fs-3 text-decoration-none">' + p.icon + '</a>' +
            '<div class="flex-grow-1"><a href="product-details.html?id=' + p.id + '" class="fw-semibold text-reset text-decoration-none">' + esc(p.name) + '</a><br>' +
              (l.out ? '<span class="badge text-bg-danger">Out of stock, remove to continue</span>' : '<small class="text-muted">' + (p.stock <= 5 ? "Only " + p.stock + " left" : "In stock") + '</small>') +
            '</div>' +
            '<div class="input-group" style="width:120px">' +
              '<button class="btn btn-outline-secondary btn-sm" data-id="' + p.id + '" data-action="minus">−</button>' +
              '<span class="form-control form-control-sm text-center">' + l.qty + '</span>' +
              '<button class="btn btn-outline-secondary btn-sm" data-id="' + p.id + '" data-action="plus">+</button>' +
            '</div>' +
            '<strong style="width:80px;text-align:right">' + money(p.price * l.qty) + '</strong>' +
            '<button class="btn btn-sm text-danger" data-id="' + p.id + '" data-action="remove">✕</button>' +
          '</div>'
        );
      }).join("");

  document.getElementById("itemsCount").textContent = cartCount() + " items";

  // totals (out-of-stock lines are not counted)
  const items = active.map(function (l) { return { price: l.product.price, qty: l.qty }; });
  const sub = items.reduce(function (s, i) { return s + i.price * i.qty; }, 0);
  const code = getCoupon();
  const t = calcTotals(items, code, shippingFor(sub, "standard"));

  document.getElementById("subtotal").textContent = money(t.subtotal);
  document.getElementById("shipping").textContent = t.shipping === 0 ? "Free" : money(t.shipping);
  document.getElementById("tax").textContent = money(t.tax);
  document.getElementById("total").textContent = money(t.total);
  document.getElementById("discountRow").classList.toggle("d-none", !t.discount);
  document.getElementById("discount").textContent = "-" + money(t.discount);
  document.getElementById("discountLabel").textContent = "Discount (" + (COUPONS[code] || 0) + "%)";
  document.getElementById("couponForm").classList.toggle("d-none", !!code);
  document.getElementById("couponApplied").classList.toggle("d-none", !code);
  document.getElementById("couponName").textContent = code + " applied";

  // checkout button
  const blocked = active.length === 0 || hasOut;
  const btn = document.getElementById("checkoutBtn");
  btn.classList.toggle("disabled", blocked);
  document.getElementById("checkoutNote").classList.toggle("d-none", !hasOut);
  refreshCounts();
}

document.getElementById("cartItems").addEventListener("click", function (e) {
  const btn = e.target.closest("button");
  if (!btn || !btn.dataset.action) return;
  const id = Number(btn.dataset.id);
  const item = getCart().find(function (i) { return i.id === id; });
  if (btn.dataset.action === "plus") setCartQty(id, item.qty + 1);
  if (btn.dataset.action === "minus") setCartQty(id, item.qty - 1);
  if (btn.dataset.action === "remove") removeFromCart(id);
  renderCart();
});

document.getElementById("couponBtn").addEventListener("click", function () {
  if (applyCoupon(document.getElementById("couponInput").value)) showToast("✓ Coupon applied");
  else showToast("Invalid coupon code", "danger");
  renderCart();
});
document.getElementById("removeCoupon").addEventListener("click", function (e) {
  e.preventDefault();
  removeCoupon();
  renderCart();
});

renderCart();
</script>
</body>
</html>
