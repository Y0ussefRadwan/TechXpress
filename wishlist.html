<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wishlist - TechXpress</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
    <h3 class="mb-0">My Wishlist <small id="wishTotal" class="text-muted fs-6"></small></h3>
    <button id="addAllBtn" class="btn btn-primary">Add all in-stock items to cart</button>
  </div>
  <div id="wishGrid" class="row g-3"></div>
  <div id="wishEmpty" class="tx-card text-center d-none">
    <p>Your wishlist is empty.</p>
    <a href="catalog.html" class="btn btn-outline-primary">Browse products</a>
  </div>
</div>
<div id="footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/store.js"></script>
<script src="js/layout.js"></script>
<script>
initPage();

function renderWishlist() {
  const list = getWishlist().map(getProduct).filter(Boolean);
  document.getElementById("wishTotal").textContent = list.length + " items";
  document.getElementById("wishEmpty").classList.toggle("d-none", list.length > 0);
  document.getElementById("addAllBtn").classList.toggle("d-none", list.length === 0);
  renderProducts(list, "wishGrid", "col-6 col-md-3");
}
// called by layout.js when a heart is clicked
function onWishlistChange() { renderWishlist(); }

document.getElementById("addAllBtn").addEventListener("click", function () {
  let count = 0;
  getWishlist().forEach(function (id) { if (addToCart(id, 1)) count++; });
  refreshCounts();
  showToast(count ? "✓ " + count + " items added to cart" : "Nothing in stock to add", count ? "success" : "warning");
});

if (requireLogin()) renderWishlist();
</script>
</body>
</html>
